name: Update market data

on:
  schedule:
    # UTC 23:00 = KST 08:00 (오전 8시 브리핑 발행)
    - cron: '0 23 * * *'
    # UTC 06:00 = KST 15:00 (한국장 마감 직후 종가 반영)
    - cron: '0 6 * * *'
    # UTC 21:00 = KST 06:00 (미국장 마감 후 종가 반영)
    - cron: '0 21 * * *'
    # 매시간 정시 (전체 갱신)
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/portfolio.json'
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run data update
        env:
          TZ: Asia/Seoul
        run: python scripts/update_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M_KST)
            git commit -m "auto: $STAMP data update"
            git push
          fi
